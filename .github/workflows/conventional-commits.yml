---
name: "Validate PR"

"on":
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            pypi.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - uses: commit-check/commit-check-action@b6819c7bfd40f576d670a78712646a67f2659ff3 # v2.18.2
        with:
          message: false
          branch: false
          pr-title: true
          job-summary: true
          pr-comments: false
        env:
          CCHK_ALLOW_COMMIT_TYPES: "build,chore,ci,docs,feat,fix,perf,refactor,revert,security,style,test"
