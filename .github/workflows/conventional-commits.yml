---
name: "Validate PR"

"on":
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: commit-check/commit-check-action@bcbadb3fec596872bcae51074d8fdbea15c02ba5 # v2.18.0
        with:
          message: false
          branch: false
          pr-title: true
          job-summary: true
          pr-comments: true
        env:
          CCHK_ALLOW_COMMIT_TYPES: "build,chore,ci,docs,feat,fix,perf,refactor,revert,security,style,test"
