---
name: release

"on":
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CI_IMAGE_NAME: ${{ github.repository }}-ci

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-release:
    name: Verify release source and checks
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source and successful main checks
        run: bash scripts/verify-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU builds pin the glibc floor (see docs/platform-support.md).
          # cargo-zigbuild links against the requested glibc version, so the
          # archive runs on Debian 11 / glibc 2.31 and newer.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.31
            artifact_name: gitlab-runner-tui-linux-amd64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.31
            artifact_name: gitlab-runner-tui-linux-arm64

          # Static musl builds have no libc dependency at all.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            artifact_name: gitlab-runner-tui-linux-amd64-musl

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            artifact_name: gitlab-runner-tui-linux-arm64-musl

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: gitlab-runner-tui-macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gitlab-runner-tui-macos-arm64

    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install mise tools
        if: ${{ matrix.zig_target }}
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.10.17
          install_args: rust zig cargo:cargo-zigbuild

      - name: Install Rust toolchain
        if: ${{ !matrix.zig_target }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Install Rust target
        if: ${{ matrix.zig_target }}
        run: mise run toolchain:targets

      - name: Build with cargo zigbuild
        if: ${{ matrix.zig_target }}
        run: cargo zigbuild --locked --release --target ${{ matrix.zig_target }}

      - name: Build with cargo
        if: ${{ !matrix.zig_target }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cd target/${{ matrix.target }}/release
          strip gitlab-runner-tui || true
          chmod +x gitlab-runner-tui
          tar czf ../../../${{ matrix.artifact_name }}.tar.gz gitlab-runner-tui

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: "*.tar.gz"
          if-no-files-found: error

  smoke-binaries:
    name: Smoke test ${{ matrix.artifact_name }}
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # debian:11 ships glibc 2.31, the declared GNU floor. The container
          # has no network and a read-only root; /tmp is the writable workdir
          # the application needs for its log directory. The CA bundle comes
          # from the runner because debian:11 does not ship one and its apt
          # mirrors are archived.
          - os: ubuntu-latest
            artifact_name: gitlab-runner-tui-linux-amd64
            image: debian:11
            max_glibc: "2.31"

          - os: ubuntu-24.04-arm
            artifact_name: gitlab-runner-tui-linux-arm64
            image: debian:11
            max_glibc: "2.31"

          # alpine has no glibc, which proves the musl builds are static.
          - os: ubuntu-latest
            artifact_name: gitlab-runner-tui-linux-amd64-musl
            image: alpine:3
            expect_static: true

          - os: ubuntu-24.04-arm
            artifact_name: gitlab-runner-tui-linux-arm64-musl
            image: alpine:3
            expect_static: true

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact_name }}

      - name: Extract binary
        run: |
          tar xzf ./*.tar.gz
          chmod +x gitlab-runner-tui

      - name: Check glibc requirements
        if: ${{ matrix.max_glibc }}
        run: |
          required=$(readelf -W --dyn-syms gitlab-runner-tui \
            | grep ' UND ' | grep -v ' WEAK ' \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu)
          weak=$(readelf -W --dyn-syms gitlab-runner-tui \
            | grep ' UND ' | grep ' WEAK ' \
            | grep -oE 'GLIBC_[0-9.]+' | sort -Vu)
          printf 'mandatory glibc versions:\n%s\n' "$required"
          printf 'weak glibc versions:\n%s\n' "$weak"
          highest=$(printf '%s\n' "$required" | sed 's/GLIBC_//' | tail -1)
          if [ "$(printf '%s\n%s\n' "${{ matrix.max_glibc }}" "$highest" | sort -V | tail -1)" != "${{ matrix.max_glibc }}" ]; then
            echo "::error::binary requires GLIBC_$highest, above the ${{ matrix.max_glibc }} floor"
            exit 1
          fi

      - name: Check musl binary is static
        if: ${{ matrix.expect_static }}
        run: |
          if readelf -d gitlab-runner-tui | grep -q NEEDED; then
            echo "::error::musl binary has dynamic dependencies"
            readelf -d gitlab-runner-tui | grep NEEDED
            exit 1
          fi
          echo "no NEEDED entries: statically linked"

      - name: Run binary on baseline image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --workdir /tmp \
            -v "$PWD/gitlab-runner-tui:/usr/local/bin/gitlab-runner-tui:ro" \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            ${{ matrix.image }} gitlab-runner-tui fetch --help
          docker run --rm --network none --read-only --tmpfs /tmp --workdir /tmp \
            -v "$PWD/gitlab-runner-tui:/usr/local/bin/gitlab-runner-tui:ro" \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            ${{ matrix.image }} gitlab-runner-tui fetch --demo > runners.json
          jq -e 'type == "object" and (.runners | type == "array") and (.runners | length > 0)' runners.json
          jq '.runners | length' runners.json

  github-release:
    name: Create GitHub Release
    needs: [release-please, verify-release, build-binaries, smoke-binaries]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: gitlab-runner-tui-*

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./*.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/*.tar.gz

      - name: Recheck release tag source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"

      - name: Upload release assets
        # Replacing this pinned action is deferred from the security-only PR.
        # v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt

  docker:
    name: Build and push containers
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Extract metadata for the GitLab CI image
        id: ci-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CI_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push GitLab CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ci-meta.outputs.tags }}
          labels: ${{ steps.ci-meta.outputs.labels }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  smoke-images:
    name: Smoke test published images
    needs: [release-please, docker]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test runtime image
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG#v}"
          docker run --rm --network none --read-only --tmpfs /tmp --workdir /tmp \
            "$image" --demo fetch --summary > runners.json
          jq -e 'type == "object" and (.runners | type == "array") and (.runners | length > 0)' runners.json

      # Mirrors a GitLab Runner job: shell detection like the generated script,
      # job commands piped on stdin, no network, read-only root, writable /tmp.
      - name: Smoke test GitLab CI job image
        run: |
          image="${REGISTRY}/${CI_IMAGE_NAME}:${IMAGE_TAG#v}"
          docker run --rm -i --network none --read-only --tmpfs /tmp --workdir /tmp \
            "$image" sh -c 'if [ -x /usr/local/bin/bash ]; then exec /usr/local/bin/bash; elif [ -x /usr/bin/bash ]; then exec /usr/bin/bash; elif [ -x /bin/bash ]; then exec /bin/bash; elif [ -x /usr/local/bin/sh ]; then exec /usr/local/bin/sh; elif [ -x /usr/bin/sh ]; then exec /usr/bin/sh; elif [ -x /bin/sh ]; then exec /bin/sh; else echo shell not found; exit 1; fi' <<'CI_SCRIPT'
          set -eu
          command -v bash sh grep jq gitlab-runner-tui
          printf 'grep-check\n' | grep '^grep-check$'
          test -s /etc/ssl/certs/ca-certificates.crt
          test "$GITLAB_RUNNER_TUI_CONTAINER" = 1
          gitlab-runner-tui fetch --help >/tmp/fetch-help.txt
          gitlab-runner-tui fetch --demo >/tmp/runners.json
          jq -e 'type == "object" and (.runners | type == "array") and (.runners | length > 0)' /tmp/runners.json
          jq '.runners | length' /tmp/runners.json
          CI_SCRIPT

  publish-crate:
    name: Publish to crates.io
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Publish to crates.io
        # Trusted publishing is tracked in issue #308.
        run: cargo publish --locked # zizmor: ignore[use-trusted-publishing]
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
