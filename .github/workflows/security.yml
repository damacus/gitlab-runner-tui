name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: Run a full-history scan
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories
          log-level: warn

  secret-changes:
    name: Current tree and new commit secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified gitleaks
        # actionlint 1.7.12 does not support the newer self-repository syntax.
        uses: ./.github/actions/setup-gitleaks # zizmor: ignore[self-repository]

      - name: Scan current tracked tree
        run: |
          git archive --format=tar HEAD --output=/tmp/current-tree.tar
          gitleaks dir --max-archive-depth=1 --redact=100 --no-banner --no-color /tmp/current-tree.tar

      - name: Scan commits introduced by this change
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="origin/$DEFAULT_BRANCH"
          fi
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          gitleaks git --log-opts="$MERGE_BASE..$HEAD_SHA" --redact=100 --no-banner --no-color .

  full-history-secret-audit:
    name: Full history (blocked by issue #155)
    if: github.event_name == 'workflow_dispatch' && inputs.full_history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified gitleaks
        # actionlint 1.7.12 does not support the newer self-repository syntax.
        uses: ./.github/actions/setup-gitleaks # zizmor: ignore[self-repository]

      - name: Scan all reachable history
        run: gitleaks git --log-opts=--all --redact=100 --no-banner --no-color .

  workflow-policy:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.10.17
          install_args: aqua:rhysd/actionlint aqua:zizmorcore/zizmor
      - run: mise run workflow:lint
      - run: mise run workflow:security
      - run: mise run test:release-gate
