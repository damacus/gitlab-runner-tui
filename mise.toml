[tools]
rust = { version = "1.98.1", components = ["clippy", "rustfmt"] }
"cargo:cargo-deny" = "0.20.2"
"aqua:rhysd/actionlint" = "1.7.12"
lefthook = "2.1.12"

[tasks.build]
description = "Build the debug binary"
run = "cargo build --verbose"

[tasks.dev]
description = "Run the application with a debug build"
run = "cargo run"

[tasks."build:release"]
description = "Build the release binary"
run = "cargo build --release --verbose"

[tasks."build:cross"]
description = "Cross-compile a release binary; pass --target <triple>"
tools = { "cargo:cross" = "0.2.5" }
run = "cross build --release"

[tasks."build:musl"]
description = "Build a Linux x86_64 musl release binary"
run = "cargo build --release --target x86_64-unknown-linux-musl"

[tasks."build:musl-static"]
description = "Build a static Linux x86_64 musl release binary"
env = { RUSTFLAGS = "-C target-feature=+crt-static" }
run = "cargo build --release --target x86_64-unknown-linux-musl"

[tasks.test]
description = "Run the full test suite"
run = "cargo test --all-features --verbose"

[tasks."test:nocapture"]
description = "Run the full test suite and show test output"
run = "cargo test --all-features -- --nocapture"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt -- --check"

[tasks."fmt:fix"]
description = "Format Rust source files"
run = "cargo fmt"

[tasks.lint]
description = "Run Clippy with CI settings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.security]
description = "Check dependencies for RustSec advisories"
run = "cargo deny --all-features check advisories"

[tasks."deps:update"]
description = "Update dependencies in Cargo.lock; accepts cargo update arguments"
run = "cargo update"

[tasks."docker:build"]
description = "Build the local container image"
run = "docker build --tag gitlab-runner-tui:local ."

[tasks."docker:demo"]
description = "Smoke-test the local container image with demo data"
run = "docker run --rm gitlab-runner-tui:local --demo fetch --summary"

[tasks."docker:build-ci"]
description = "Build the GitLab CI job image"
run = "docker build --target ci --tag gitlab-runner-tui-ci:local ."

[tasks."docker:ci-smoke"]
description = "Check the CI image tools and JSON output"
run = '''
docker run --rm gitlab-runner-tui-ci:local sh -c 'command -v gitlab-runner-tui && command -v bash && command -v grep && command -v jq && gitlab-runner-tui --demo fetch --summary | jq -e ".runners | arrays" >/dev/null'
'''

[tasks."workflow:lint"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."diff:check"]
description = "Check the working tree for whitespace errors"
run = "git diff --check"

[tasks."hooks:install"]
description = "Install the repository Git hooks"
run = "lefthook install"

[tasks.check]
description = "Run the local CI and security checks"
depends = ["build", "build:release", "test", "fmt", "lint", "security", "workflow:lint", "diff:check"]
