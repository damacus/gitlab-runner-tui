[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-zigbuild" = "0.23.4"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.0"
gitleaks = "8.30.1"
lefthook = "2.1.12"
zig = "0.15.2"

[tasks.build]
description = "Build the debug binary"
run = "cargo build --locked --verbose"

[tasks.dev]
description = "Run the application with a debug build"
run = "cargo run"

[tasks."build:release"]
description = "Build the release binary"
run = "cargo build --locked --release --verbose"

[tasks."build:cross"]
description = "Cross-compile a release binary; pass --target <triple>"
run = "cargo zigbuild --locked --release"

[tasks."build:musl"]
description = "Build a Linux x86_64 musl release binary"
run = "cargo build --locked --release --target x86_64-unknown-linux-musl"

[tasks."build:musl-static"]
description = "Build a static Linux x86_64 musl release binary"
env = { RUSTFLAGS = "-C target-feature=+crt-static" }
run = "cargo zigbuild --locked --release --target x86_64-unknown-linux-musl"

[tasks.test]
description = "Run the full test suite"
run = "cargo test --locked --all-features --verbose"

[tasks."test:nocapture"]
description = "Run the full test suite and show test output"
run = "cargo test --locked --all-features -- --nocapture"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt -- --check"

[tasks."fmt:fix"]
description = "Format Rust source files"
run = "cargo fmt"

[tasks.lint]
description = "Run Clippy with CI settings"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.security]
description = "Check dependencies for RustSec advisories"
run = "cargo deny --all-features check advisories"

[tasks."deps:update"]
description = "Update dependencies in Cargo.lock; accepts cargo update arguments"
run = "cargo update"

[tasks."deps:tree"]
description = "Inspect the resolved dependency tree; accepts cargo tree arguments"
run = "cargo tree"

[tasks."toolchain:targets"]
description = "Install the Rust targets used by local cross-build verification"
run = "rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-gnu"

[tasks."docker:build"]
description = "Build the local container image"
run = "docker build --tag gitlab-runner-tui:local ."

[tasks."docker:demo"]
description = "Smoke-test the local container image with demo data"
run = "docker run --rm gitlab-runner-tui:local --demo fetch --summary"

[tasks."docker:build-ci"]
description = "Build the GitLab CI job image"
run = "docker build --target ci --tag gitlab-runner-tui-ci:local ."

[tasks."docker:ci-smoke"]
description = "Check the CI image tools and JSON output"
run = '''
docker run --rm gitlab-runner-tui-ci:local sh -c 'command -v gitlab-runner-tui && command -v bash && command -v grep && command -v jq && gitlab-runner-tui --demo fetch --summary | jq -e ".runners | arrays" >/dev/null'
'''

[tasks."workflow:lint"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."workflow:security"]
description = "Check Actions for unsafe permissions, inputs and dependencies"
run = "zizmor --offline --no-progress .github"

[tasks."security:history"]
description = "Scan all reachable Git history with fully redacted findings"
run = "gitleaks git --log-opts=--all --redact=100 --no-banner --no-color ."

[tasks."security:main-history"]
description = "Scan the fetched main branch history with fully redacted findings"
run = "gitleaks git --log-opts=origin/main --redact=100 --no-banner --no-color ."

[tasks."diff:check"]
description = "Check the working tree for whitespace errors"
run = "git diff --check"

[tasks."hooks:install"]
description = "Install the repository Git hooks"
run = "lefthook install"

[tasks.check]
description = "Run the local CI and security checks"
depends = ["build", "build:release", "test", "fmt", "lint", "security", "workflow:lint", "workflow:security", "diff:check"]
